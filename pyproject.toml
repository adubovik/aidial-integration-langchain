[project]
name = "aidial-integration-langchain"
version = "0.1.0"
description = "Utilities for integration of AI DIAL API with Langchain library"
authors = [
    {name="DIAL", email="EPAM RAIL <SpecialEPM-DIALDevTeam@epam.com>"}
]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.9,<4.0"
dependencies = [
    "langchain<0.4",
    "langchain-core<0.4",
    "langchain-openai>=0.1.1,<0.4",
    "openai==1.58.1",
    "httpx==0.27.2"
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.2",
    "pytest-asyncio>=0.21.1",
    "nox>=2023.4.22"
]
lint = [
    "flake8>=6.0.0",
    "black>=23.3,<25.0",
    "isort>=5.12.0",
    "pyright>=1.1.324",
    "autoflake>=2.2.0"
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
version = "1.0"

[tool.pytest.ini_options]
testpaths = [
    "tests"
]
filterwarnings = [
    "error",
    "ignore:Failing to pass a value to the 'type_params' parameter:DeprecationWarning",
    "ignore:urllib3 v2 only supports OpenSSL"
]

[tool.pyright]
typeCheckingMode = "basic"
reportUnusedVariable = "error"
reportIncompatibleMethodOverride = "error"
exclude = [
    ".git",
    "**/.venv",
    ".nox",
    ".pytest_cache",
    "**/__pycache__",
    "build"
]

[tool.black]
line-length = 80
exclude = '''
/(
    \.git
  | \.venv
  | \.nox
  | \.pytest_cache
  | \.__pycache__
)/
'''

[tool.isort]
line_length = 80
profile = "black"
extend_skip_glob = ["*/langchain_openai/*"]

[tool.autoflake]
ignore_init_module_imports = true
remove_all_unused_imports = true
in_place = true
recursive = true
quiet = true
exclude = [
    ".nox",
    ".pytest_cache",
    "\\.venv"
]
